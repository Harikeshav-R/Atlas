name: Feature request
description: Suggest a capability or improvement for Atlas.
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check `docs/PROJECT.md` (especially the
        phased roadmap and non-goals) to see whether this is already planned or
        explicitly out of scope before filing.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: phase
    attributes:
      label: Which roadmap phase does this relate to?
      description: See docs/PROJECT.md §15. Choose "Unsure / new" if it isn't covered.
      options:
        - "Phase 0 — Foundations"
        - "Phase 1 — Core loop"
        - "Phase 2 — Discovery & background"
        - "Phase 3 — Scheduling & status intelligence"
        - "Phase 4 — Polish & depth"
        - "Unsure / new"
    validations:
      required: false
