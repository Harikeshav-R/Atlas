[project]
name = "atlas"
description = "A local-first, terminal-native job-application co-pilot for software engineers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harikeshav Rameshkumar" }]
requires-python = ">=3.11"
keywords = ["job-search", "resume", "tui", "cli", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "keyrings-alt>=5.0.2",
    "litellm>=1.95.0",
    "platformdirs>=4.11.0",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlmodel>=0.0.39",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
    "weasyprint>=63",
]

[project.urls]
Homepage = "https://github.com/Harikeshav-R/Atlas"
Repository = "https://github.com/Harikeshav-R/Atlas"
Documentation = "https://github.com/Harikeshav-R/Atlas/blob/main/docs/PROJECT.md"

[project.scripts]
atlas = "atlas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/atlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "ruff==0.16.1",
]

# --- Ruff (formatter + linter) --------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Docs contain illustrative code snippets that must not be reformatted/linted;
# Alembic's generated migration environment/scripts follow their own style.
extend-exclude = ["docs", "src/atlas/db/migrations"]

[tool.ruff.lint]
# A pragmatic, strict-leaning rule set. Expanded as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
    "D",   # pydocstyle (docstrings required — see AGENTS.md §8)
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
# Tests don't require module/package/class/function docstrings.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters via calls in argument defaults
# (``x: T = typer.Argument(...)``). These are the framework's declarative idiom,
# not mutable-default bugs, so exempt them from B008. (Primitive-typed params are
# already exempt as immutable types; this covers the rest, e.g. ``Path``.)
extend-immutable-calls = ["typer.Argument", "typer.Option"]

# --- mypy (strict) --------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
# Alembic's generated migration environment/scripts are boilerplate driven by
# Alembic at runtime (not imported by checked code), so they are not type-checked.
exclude = ["src/atlas/db/migrations/"]

# WeasyPrint ships no type stubs; it is imported lazily behind the PdfRenderer
# seam (src/atlas/render/renderer.py) and never in the hermetic suite.
[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

# APScheduler ships no type stubs; it is imported lazily behind the Scheduler
# seam (src/atlas/daemon/scheduler.py) and never in the hermetic suite.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# --- pytest + coverage ----------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# Textual screen tests are async (driven by App.run_test()); "auto" mode runs
# `async def test_*` functions without a per-test marker (keeps --strict-markers happy).
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=atlas",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["atlas"]
# Migration scripts run under Alembic, not pytest; the upgrade is proven
# end-to-end by tests/test_db_migrate.py rather than by line coverage.
omit = ["*/atlas/db/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
